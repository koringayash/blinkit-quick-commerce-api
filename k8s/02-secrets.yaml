apiVersion: v1
kind: Secret
metadata:
  name: quickkart-secrets
  namespace: quickkart
  labels:
    app.kubernetes.io/part-of: quickkart
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values before deploying to a public cluster
  POSTGRES_PASSWORD: "quickkart-prod-db-password-change-me"
  DATABASE_URL: "postgresql+asyncpg://quickkart:quickkart-prod-db-password-change-me@postgres.quickkart.svc.cluster.local:5432/quickkart"
  JWT_SECRET: "change-me-in-production-use-64-char-random-hex-secret"
  RAZORPAY_KEY_ID: "rzp_test_mock_key"
  RAZORPAY_KEY_SECRET: "mock_key_secret"
  RAZORPAY_WEBHOOK_SECRET: "mock_webhook_secret"

