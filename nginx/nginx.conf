# ---------------------------------------------------------------------------
# Nginx Reverse Proxy for single-origin production deployment
#   /api/* -> FastAPI backend (http://backend:8000/*)
#   /*     -> TanStack Start SSR frontend (http://frontend:3000/*)
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream quickkart_backend {
        server backend:8000;
    }

    upstream quickkart_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # 1. Server-Sent Events (SSE) 1-Hz live GPS stream: disable buffering & extend timeout
        location ~ ^/api/me/orders/[0-9]+/tracking/stream$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://quickkart_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # 2. FastAPI Backend API routes (/api/* -> /*)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://quickkart_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Frontend SSR & static assets
        location / {
            proxy_pass http://quickkart_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

