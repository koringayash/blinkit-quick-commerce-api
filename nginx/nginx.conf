# ---------------------------------------------------------------------------
# Nginx Reverse Proxy for single-origin production deployment
#   /nginx-health                      -> 200 OK gateway health check
#   /api/me/orders/{id}/tracking/stream -> FastAPI 1-Hz SSE stream (unbuffered)
#   /api/*                             -> FastAPI backend (http://backend:8000/*)
#   /*                                 -> TanStack Start SSR frontend (http://frontend:3000/*)
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Enable gzip compression for JSON/JS/CSS responses (disabled on SSE stream below)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/plain
        image/svg+xml;

    # Map Upgrade header properly so normal HTTP requests keep `Connection: ""`
    # while WebSocket upgrades send `Connection: "upgrade"`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream quickkart_backend {
        server backend:8000;
        keepalive 32;
    }

    upstream quickkart_frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Gateway health probe
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 1. Server-Sent Events (SSE) 1-Hz live GPS stream: disable buffering & gzip
        location ~ ^/api/me/orders/[0-9]+/tracking/stream$ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://quickkart_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 2. FastAPI Backend API routes (/api/* -> /*)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://quickkart_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Hashed static assets from Vite/Nitro build (safe to cache long-term)
        location /assets/ {
            proxy_pass http://quickkart_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 4. Frontend SSR pages
        location / {
            proxy_pass http://quickkart_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
