# QuickKart - full stack: PostgreSQL + FastAPI backend + TanStack Start frontend
#
#   docker compose up --build -d      (or: make up)
#
#   Frontend  -> http://localhost:3000
#   API       -> http://localhost:8000      (Swagger: http://localhost:8000/docs)
#   Postgres  -> localhost:5432
#
# All values can be overridden in a `.env` file next to this file (see .env.example).

name: quickkart

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickkart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickkart}
      POSTGRES_DB: ${POSTGRES_DB:-quickkart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quickkart-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quickkart}:${POSTGRES_PASSWORD:-quickkart}@db:5432/${POSTGRES_DB:-quickkart}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@quickkart.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-MOCK}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-mock_key_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-mock_webhook_secret}
      PAYMENT_TIMEOUT_MINUTES: ${PAYMENT_TIMEOUT_MINUTES:-15}
      ORDER_EXPIRY_SWEEP_SECONDS: ${ORDER_EXPIRY_SWEEP_SECONDS:-60}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        # The browser calls the API directly, so this must be reachable from the user's machine
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: quickkart-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:

