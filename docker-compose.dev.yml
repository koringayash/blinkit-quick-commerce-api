# Development override: hot reload for both backend and frontend.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build     (or: make dev)
#
#   Frontend (Vite dev server) -> http://localhost:8080
#   API (uvicorn --reload)     -> http://localhost:8000

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      LOG_FORMAT: text
      LOG_LEVEL: DEBUG
      # Polling makes --reload work on Docker Desktop (Windows/macOS) bind mounts
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app

  frontend:
    build:
      target: dev
    image: quickkart-frontend:dev
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      # Polling makes file watching work reliably on Docker Desktop for Windows/macOS bind mounts
      CHOKIDAR_USEPOLLING: "true"
    ports: !override
      - "${FRONTEND_DEV_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      # keep the container's Linux node_modules instead of the host's
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5